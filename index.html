<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>剑影 · 迷宫竞技场</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101722;color:#e8eef7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}.wrap{width:min(1000px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 2px 13px}.title{font-size:clamp(20px,4vw,28px);font-weight:800;letter-spacing:.03em}.stats{display:flex;gap:18px;color:#a9b7c9;font:600 13px ui-monospace,monospace}.stats b{color:#f4f7fb}.frame{border:1px solid #344153;border-radius:14px;overflow:hidden;background:#172231;box-shadow:0 18px 60px #0005}canvas{display:block;width:100%;height:auto;touch-action:none}.help{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:13px 4px;color:#9aa9bc;font-size:13px}.help kbd{display:inline-block;padding:2px 6px;border:1px solid #465569;border-radius:5px;background:#1b2736;color:#eff5fc;font:600 12px ui-monospace,monospace}.tip{color:#71839a}@media(max-width:600px){body{padding:12px}.stats{gap:9px;font-size:11px}.help{font-size:11px}}
</style></head>
<body><main class="wrap"><header><div class="title">剑影 <span style="color:#58d6c3">/</span> 迷宫竞技场</div><div class="stats"><span>击败 <b id="kills">0</b></span><span>生命 <b id="hp">5</b></span><span id="power">技能 无</span></div></header><div class="frame"><canvas id="arena" width="960" height="600" aria-label="方块竞技场游戏区域"></canvas></div><div class="help"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动　 <kbd>J</kbd> 挥剑　 <kbd>K</kbd> 向前瞬身</span><span class="tip">拾取刺杀技能方块　·　击败敌人恢复生命　·　按任意键重开</span></div></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#arena'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,killsEl=document.querySelector('#kills'),hpEl=document.querySelector('#hp');
const powerEl=document.querySelector('#power'),keys=new Set(),player={x:W/2,y:H/2,size:25,speed:230,hp:5,invuln:0,face:{x:1,y:0},attack:0,attackCooldown:0,dash:null,dashCooldown:0,assassinate:0};let enemies=[],pickups=[],particles=[],kills=0,spawnClock=0,last=0,gameOver=false,elapsed=0,pickupClock=1.5;
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function spawnPickup(){let x,y;for(let n=0;n<50;n++){x=rand(45,W-45);y=rand(45,H-45);if(!circleHitsWall(x,y,15)&&Math.hypot(x-player.x,y-player.y)>90)break}if(!circleHitsWall(x,y,15))pickups.push({x,y,life:20,phase:rand(0,6.28)})}
function activatePickup(){player.assassinate=1;powerEl.textContent='技能 刺杀';burst(player.x,player.y,'#ffb54c',14)}
const walls=[];function buildMaze(){walls.length=0;const t=18;for(const [x,y,w,h] of [[145,72,230,t],[520,72,280,t],[95,198,t,145],[245,186,240,t],[580,178,t,145],[690,230,180,t],[150,388,275,t],[485,338,250,t],[850,360,t,150],[300,468,t,110],[530,478,300,t],[420,250,t,85],[35,145,110,t],[800,145,125,t],[35,330,115,t],[425,510,105,t]])walls.push({x,y,w,h})}function circleHitsWall(x,y,r){return walls.some(w=>{const px=clamp(x,w.x,w.x+w.w),py=clamp(y,w.y,w.y+w.h);return (x-px)**2+(y-py)**2<r*r})}function clearRay(x1,y1,x2,y2){const n=Math.ceil(Math.hypot(x2-x1,y2-y1)/8);for(let i=1;i<n;i++){const t=i/n;if(walls.some(w=>{const x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;return x>=w.x-3&&x<=w.x+w.w+3&&y>=w.y-3&&y<=w.y+w.h+3}))return false}return true}function moveBody(o,dx,dy,r){const nx=clamp(o.x+dx,r+3,W-r-3),ny=clamp(o.y+dy,r+3,H-r-3);if(!circleHitsWall(nx,o.y,r))o.x=nx;if(!circleHitsWall(o.x,ny,r))o.y=ny}function dashPosition(sx,sy,tx,ty,q){let x=sx,y=sy,steps=Math.max(1,Math.ceil(Math.hypot(tx-sx,ty-sy)*q/5));for(let i=1;i<=steps;i++){const u=i/steps,nx=sx+(tx-sx)*q*u,ny=sy+(ty-sy)*q*u;if(circleHitsWall(nx,ny,player.size/2))break;x=nx;y=ny}return{x,y}}function enemySpawn(){for(let tries=0;tries<60;tries++){const x=rand(38,W-38),y=rand(38,H-38);if(!circleHitsWall(x,y,16)&&Math.hypot(x-player.x,y-player.y)>180){let size=rand(20,30);enemies.push({x,y,size,speed:rand(48,78)+Math.min(35,kills*1.2),hp:1,phase:rand(0,6.28)});return}}}
function reset(){buildMaze();player.x=W/2;player.y=H/2;player.hp=5;player.invuln=0;player.face={x:1,y:0};player.attack=0;player.attackCooldown=0;player.dash=null;player.dashCooldown=0;player.assassinate=0;enemies=[];pickups=[];particles=[];powerEl.textContent='技能 无';kills=0;spawnClock=.8;pickupClock=1.5;elapsed=0;gameOver=false;killsEl.textContent='0';hpEl.textContent='5';last=performance.now();for(let i=0;i<3;i++)enemySpawn();requestAnimationFrame(loop)}
function attack(){if(gameOver||player.attackCooldown>0)return;player.attack=.32;player.attackCooldown=.42;let angle=Math.atan2(player.face.y,player.face.x);for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy),a=Math.atan2(dy,dx),diff=Math.atan2(Math.sin(a-angle),Math.cos(a-angle));if(d<78+e.size/2&&Math.abs(diff)<=Math.PI*40/180&&clearRay(player.x,player.y,e.x,e.y)){burst(e.x,e.y,'#a9f9eb',10);enemies.splice(i,1);countKill()}}}
function dash(){if(gameOver||player.dash||player.dashCooldown>0)return;const isAssassin=player.assassinate>0,length=isAssassin?210:145,duration=isAssassin?.36:.28;const end=dashPosition(player.x,player.y,player.x+player.face.x*length,player.y+player.face.y*length,1);player.dash={x:player.x,y:player.y,sx:player.x,sy:player.y,tx:end.x,ty:end.y,t:0,duration,assassin:isAssassin,hit:new Set()};player.assassinate=0;player.dashCooldown=.6;player.invuln=Math.max(player.invuln,duration);if(isAssassin)powerEl.textContent='技能 无'}

function teleport(){dash()}

function pointSegmentDistance(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,t=clamp(((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(px-(x1+dx*t),py-(y1+dy*t))}function countKill(){kills++;killsEl.textContent=String(kills);if(kills%3===0&&player.hp<5){player.hp++;hpEl.textContent=String(player.hp)}}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=rand(40,170);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.2,.55),max:.55,color,size:rand(2,5)})}}
function roundedRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawSword(){const a=Math.atan2(player.face.y,player.face.x),sweep=player.attack>0?((.32-player.attack)/.32-.5)*Math.PI*80/180:0;ctx.save();ctx.translate(player.x,player.y);ctx.rotate(a+sweep);ctx.shadowColor='#f4dfaa';ctx.shadowBlur=12;ctx.lineCap='round';ctx.strokeStyle='#f5e6c4';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(7,1);ctx.lineTo(44,0);ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#b88950';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(9,-7);ctx.lineTo(9,7);ctx.stroke();ctx.strokeStyle='#d9e5ed';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(44,0);ctx.lineTo(52,0);ctx.stroke();ctx.restore()}
function drawGrid(){ctx.fillStyle='#172231';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#263448';ctx.lineWidth=1;for(let x=24;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=24;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const w of walls){ctx.shadowColor='#09111b';ctx.shadowBlur=9;ctx.fillStyle='#39495d';ctx.fillRect(w.x,w.y,w.w,w.h);ctx.shadowBlur=0;ctx.fillStyle='#63758b';if(w.w>w.h)ctx.fillRect(w.x,w.y,w.w,4);else ctx.fillRect(w.x,w.y,4,w.h)}ctx.strokeStyle='#405269';ctx.lineWidth=2;ctx.strokeRect(1,1,W-2,H-2)}
function draw(){drawGrid();for(const item of pickups){const s=18+Math.sin(item.phase)*2;ctx.save();ctx.translate(item.x,item.y);ctx.rotate(Math.PI/4);ctx.shadowColor='#ffb54c';ctx.shadowBlur=18;ctx.fillStyle='#ffb54c';ctx.fillRect(-s/2,-s/2,s,s);ctx.shadowBlur=0;ctx.rotate(-Math.PI/4);ctx.fillStyle='#332516';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('刺',0,0);ctx.restore()}for(const e of enemies){let pulse=Math.sin(e.phase)*2;ctx.shadowColor='#ff637a';ctx.shadowBlur=12;roundedRect(e.x-e.size/2-pulse/2,e.y-e.size/2-pulse/2,e.size+pulse,e.size+pulse,5,'#f15b72');ctx.shadowBlur=0;ctx.fillStyle='#371c2a';ctx.fillRect(e.x-6,e.y-3,4,4);ctx.fillRect(e.x+3,e.y-3,4,4);ctx.strokeStyle='#ffd4a3';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(e.x+e.size*.35,e.y+e.size*.2);ctx.lineTo(e.x+e.size*.7,e.y+e.size*.2);ctx.stroke();ctx.fillStyle='#ffe4b8';ctx.fillRect(e.x+e.size*.58,e.y+e.size*.08,9,5)}
if(player.dash){const q=player.dash.t/player.dash.duration;for(let n=0;n<4;n++){const back=(n+1)*.07,bt=clamp(q-back,0,1),alpha=(1-n/4)*.28;ctx.globalAlpha=alpha;ctx.fillStyle=player.dash.assassin?'#ffbd62':'#6de5d5';roundedRect(player.dash.sx+(player.dash.x-player.dash.sx)*bt-player.size/2,player.dash.sy+(player.dash.y-player.dash.sy)*bt-player.size/2,player.size,player.size,5,ctx.fillStyle)}ctx.globalAlpha=1;ctx.strokeStyle=player.dash.assassin?'#ffc36d':'#79eada';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+player.face.x*30,player.y+player.face.y*30);ctx.stroke()}
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/(p.max||.55));if(p.vx!==undefined){ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}else{ctx.strokeStyle=p.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1-p.life),0,Math.PI*2);ctx.stroke()}}ctx.globalAlpha=1;
if(player.invuln<=0||Math.floor(elapsed*18)%2===0){ctx.save();ctx.translate(player.x,player.y);ctx.shadowColor='#59dfce';ctx.shadowBlur=18;roundedRect(-player.size/2,-player.size/2,player.size,player.size,5,player.attack>0?'#b3fff2':'#52d7c4');ctx.shadowBlur=0;ctx.fillStyle='#173942';ctx.fillRect(-7,-4,4,4);ctx.fillRect(3,-4,4,4);ctx.fillStyle='#eafffb';ctx.beginPath();ctx.moveTo(player.face.x*17,player.face.y*17);ctx.lineTo(player.face.x*9-player.face.y*4,player.face.y*9+player.face.x*4);ctx.lineTo(player.face.x*9+player.face.y*4,player.face.y*9-player.face.x*4);ctx.fill();ctx.restore()}
drawSword();if(gameOver){ctx.fillStyle='#07111dd9';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#f3f6fb';ctx.font='800 40px system-ui';ctx.fillText('被击中了！',W/2,H/2-18);ctx.fillStyle='#a9b8ca';ctx.font='18px system-ui';ctx.fillText('击败 '+kills+' 个敌人 · 按任意键重新开始',W/2,H/2+24)}}
function loop(now){if(gameOver){draw();return}let dt=Math.min((now-last)/1000,.04);last=now;elapsed+=dt;player.invuln=Math.max(0,player.invuln-dt);let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);if(dx||dy){let m=Math.hypot(dx,dy);dx/=m;dy/=m;player.face={x:dx,y:dy}}player.attack=Math.max(0,player.attack-dt);player.attackCooldown=Math.max(0,player.attackCooldown-dt);player.dashCooldown=Math.max(0,player.dashCooldown-dt);if(player.dash){const d=player.dash;d.t=Math.min(d.duration,d.t+dt);const q=d.t/d.duration,pos=dashPosition(d.sx,d.sy,d.tx,d.ty,q);player.x=pos.x;player.y=pos.y;if(Math.hypot(player.x-d.tx,player.y-d.ty)<2&&q>0.99)d.t=d.duration;if(d.assassin){for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(!d.hit.has(e)&&pointSegmentDistance(e.x,e.y,d.sx,d.sy,player.x,player.y)<e.size/2+13){d.hit.add(e);burst(e.x,e.y,'#ffc66d',12);enemies.splice(i,1);countKill()}}}if(d.t>=d.duration){player.dash=null;burst(player.x,player.y,'#74e7d8',8)}}else if(dx||dy)moveBody(player,dx*player.speed*dt,dy*player.speed*dt,player.size/2);
spawnClock-=dt;if(spawnClock<=0&&enemies.length<14){enemySpawn();spawnClock=Math.max(.45,1.25-kills*.018)}pickupClock-=dt;if(pickupClock<=0&&pickups.length<5){spawnPickup();pickupClock=rand(3,5)}for(let i=pickups.length-1;i>=0;i--){let item=pickups[i];item.phase+=dt*4;item.life-=dt;if(Math.hypot(player.x-item.x,player.y-item.y)<player.size/2+13){activatePickup();pickups.splice(i,1)}else if(item.life<=0)pickups.splice(i,1)}

for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.phase+=dt*5;let oldX=e.x,oldY=e.y;moveBody(e,dx/d*e.speed*dt,dy/d*e.speed*dt,e.size/2);if(e.x===oldX&&e.y===oldY)e.phase+=Math.PI*.3;if(d<player.size/2+e.size/2&&player.invuln<=0){player.hp--;hpEl.textContent=String(player.hp);player.invuln=.8;burst(player.x,player.y,'#ff6279',12);e.x-=dx/d*35;e.y-=dy/d*35;if(player.hp<=0){gameOver=true;keys.clear()}}}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;if(p.vx!==undefined){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97}if(p.life<=0)particles.splice(i,1)}draw();if(!gameOver)requestAnimationFrame(loop)}
function handleKey(e){let key=e.key.toLowerCase();if(['w','a','s','d','j','k','arrowup','arrowdown','arrowleft','arrowright',' '].includes(key))e.preventDefault();if(gameOver){if(!['shift','control','alt'].includes(key)){keys.clear();reset()}return}if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(key))keys.add(key);if(e.repeat)return;if(key==='j')attack();if(key==='k')teleport()}
window.addEventListener('keydown',handleKey);window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());buildMaze();draw();last=performance.now();requestAnimationFrame(loop);
})();
</script></body></html>
