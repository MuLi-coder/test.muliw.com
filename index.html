<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf6ec">
  <title>海岸骑行 · Pelican Cycling Club</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #faf6ec;
      --ink: #253e42;
      --muted: #78908a;
      --line: #dcded1;
      --sea: #5daaa5;
      --orange: #ee8966;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px clamp(16px, 4vw, 56px) 24px;
      color: var(--ink);
      background: var(--paper);
      font-family: "Trebuchet MS", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .page { max-width: 1160px; margin: 0 auto; }
    .nav, .brand, .intro, .controls, .control-group, .live, .play {
      display: flex; align-items: center;
    }
    .nav { justify-content: space-between; gap: 16px; }
    .brand { gap: 12px; text-decoration: none; color: inherit; }
    .brand-icon { width: 43px; height: 43px; }
    .brand-name { font-size: 11px; line-height: 1.5; letter-spacing: 2px; font-weight: 800; }
    .nav-note { font-size: 11px; letter-spacing: 1.4px; color: var(--muted); }
    .intro { justify-content: space-between; gap: 24px; padding: 36px 0 25px; }
    .eyebrow { margin: 0 0 10px; font-size: 10px; letter-spacing: 3px; color: #778b7c; font-weight: 700; }
    h1 { margin: 0; font-size: clamp(27px, 3.65vw, 44px); line-height: 1.4; font-weight: 650; letter-spacing: -.06em; }
    .intro-description { margin: 11px 0 0; font-size: 13px; line-height: 1.8; letter-spacing: .3px; color: #6c817a; }
    .postmark {
      width: 88px; height: 88px; flex: 0 0 auto;
      border: 1px dashed #a5afa0; border-radius: 50%;
      display: grid; place-content: center; text-align: center;
      transform: rotate(10deg); color: #899984;
    }
    .postmark span { font-size: 9px; letter-spacing: 2px; }
    .postmark strong { display: block; font-size: 25px; font-weight: 400; margin: 2px 0; }
    .postmark small { font-size: 8px; letter-spacing: 1.5px; }
    .scene-shell { border: 1px solid #d6dfd5; border-radius: 22px; overflow: hidden; background: #e6eee1; box-shadow: 0 14px 40px #29453908; }
    .scene-svg { display: block; width: 100%; height: auto; }
    .controls { justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 17px 22px; background: #fffdf4; border-top: 1px solid #d6dfd5; }
    .live { gap: 9px; font-size: 12px; letter-spacing: .4px; color: #758b80; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #75a88b; box-shadow: 0 0 0 4px #75a88b14; }
    .control-group { gap: 16px; }
    .speed-control { display: flex; align-items: center; gap: 3px; padding: 3px; border: 1px solid #e5e7dc; border-radius: 100px; }
    .speed-button { background: transparent; color: #87978c; border: 0; border-radius: 100px; padding: 7px 11px; min-width: 42px; cursor: pointer; font-size: 11px; transition: background .2s, color .2s; }
    .speed-button[aria-pressed="true"] { color: #3e6555; background: #e8eee1; font-weight: 700; }
    .speed-button:hover { color: var(--ink); }
    .play { gap: 8px; justify-content: center; min-width: 89px; background: var(--ink); color: #fff9e9; border: 0; border-radius: 100px; padding: 11px 16px; font-size: 12px; cursor: pointer; }
    .play svg { width: 12px; height: 12px; }
    .play:hover { background: #3b5d5d; }
    button:focus-visible { outline: 3px solid #e7b154; outline-offset: 4px; }
    .footer { display: flex; justify-content: space-between; gap: 16px; padding: 19px 3px 0; font-size: 10px; color: #98a397; letter-spacing: 1.5px; }
    @media (max-width: 600px) {
      body { padding-top: 20px; }
      .nav-note { font-size: 9px; letter-spacing: .7px; }
      .brand-name { font-size: 9px; letter-spacing: 1.4px; }
      .brand-icon { width: 35px; height: 35px; }
      .intro { padding-top: 28px; padding-bottom: 20px; gap: 12px; }
      .intro-description { font-size: 11px; max-width: 230px; }
      .postmark { width: 63px; height: 63px; }
      .postmark strong { font-size: 19px; }
      .postmark span, .postmark small { font-size: 7px; letter-spacing: 1px; }
      .scene-shell { border-radius: 16px; }
      .controls { padding: 13px; gap: 12px; }
      .live { font-size: 10px; }
      .control-group { gap: 8px; }
      .speed-button { min-width: 32px; padding: 6px 7px; font-size: 10px; }
      .play { min-width: 67px; padding: 9px 11px; font-size: 11px; }
      .footer { font-size: 8px; letter-spacing: .6px; }
    }
    @media (max-width: 390px) {
      .controls { justify-content: center; }
      .live { width: 100%; justify-content: center; }
      .postmark { display: none; }
    }
  </style>
</head>

              <path d="M674 217Q680 214 686 218" fill="none" stroke="#8d9b87" stroke-width="2" stroke-linecap="round"/>
              <ellipse cx="688" cy="241" rx="6" ry="3.8" fill="#e8be96" opacity=".7"/>

              <path id="scarf-tail" d="M633 276Q603 260 582 276Q563 288 543 269L554 293Q574 306 598 292L633 291Z" fill="#659890" stroke="#344849" stroke-width="2.8" stroke-linejoin="round"/>
              <path d="M619 278Q635 283 655 270L658 282Q640 294 622 289Z" fill="#76a79a" stroke="#344849" stroke-width="2.8"/>
              <path d="M626 282L628 288M641 280L644 287" stroke="#d9e0bc" stroke-width="2.5" stroke-linecap="round"/>
              <path d="M517 340Q543 323 572 332Q594 340 595 359Q573 381 536 374Q521 365 517 340Z" fill="#ced8ca" stroke="#344849" stroke-width="3"/>
              <path d="M532 344Q555 358 578 347M533 355Q554 369 575 358" fill="none" stroke="#a7bbaa" stroke-width="2.8" stroke-linecap="round"/>
            </g>

            <!-- The extended wing maintains contact with the handlebar. -->
            <path id="steering-wing" d="M566 340Q592 332 624 359Q675 397 755 402L754 411Q679 420 613 380Q571 379 552 359Z" fill="#e7ecdc" stroke="#344849" stroke-width="3.2" stroke-linejoin="round"/>
            <path id="steering-feathers" d="M602 364Q665 406 739 405M612 373Q670 411 732 411" fill="none" stroke="#b6caba" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M748 400Q758 398 764 404L761 413Q754 418 748 412Z" fill="#d3dfcd" stroke="#344849" stroke-width="2.8"/>

            <!-- A small front light. -->
            <path d="M768 439L779 436" stroke="#344849" stroke-width="3"/>
            <rect x="776" y="429" width="11" height="15" rx="4" fill="#efd6a4" stroke="#344849" stroke-width="2.5"/>
          </g>

          <!-- Foreground grass, spaced widely for a quiet composition. -->
          <g id="foreground-plants">
            <use href="#grass-clump" x="176" y="709" transform="translate(0 -13)"/>
            <use href="#grass-clump" x="998" y="709" transform="translate(0 -5)"/>
            <use href="#grass-clump" x="1376" y="709" transform="translate(0 -13)"/>
            <use href="#grass-clump" x="2198" y="709" transform="translate(0 -5)"/>
          </g>
          <g id="wind-lines" fill="none" stroke="#728f7c" stroke-width="2.3" stroke-linecap="round" opacity=".47">
            <path d="M364 266H407M347 279H381M390 292H415"/>
          </g>
          <rect width="1200" height="710" fill="url(#paper-grain)" pointer-events="none"/>
          <g fill="#5d8178" font-family="Trebuchet MS, sans-serif" opacity=".75">
            <text x="36" y="51" font-size="10" letter-spacing="2.5">SEA BREEZE / GOOD COMPANY</text>
            <text x="1162" y="680" text-anchor="end" font-size="10" letter-spacing="2">NO DESTINATION NEEDED.</text>
          </g>
        </g>
      </svg>

      <div class="controls">
        <div class="live"><span class="live-dot" aria-hidden="true"></span><span id="status" role="status">正在海岸线骑行</span></div>
        <div class="control-group">
          <div class="speed-control" role="group" aria-label="骑行速度">
            <button class="speed-button" type="button" data-speed="0.65" aria-pressed="false" aria-label="慢速，0.65 倍">慢慢</button>
            <button class="speed-button" type="button" data-speed="1" aria-pressed="true" aria-label="正常速度，1 倍">1×</button>
            <button class="speed-button" type="button" data-speed="1.5" aria-pressed="false" aria-label="快速，1.5 倍">1.5×</button>
          </div>
          <button class="play" id="play-toggle" type="button" aria-label="暂停动画" aria-pressed="false">
            <svg id="play-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 2V10M9 2V10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            <span id="play-label">暂停</span>
          </button>
        </div>
      </div>
    </section>

    <footer class="footer"><span>A TINY ANIMATED POSTCARD</span><span>愿每一天，都有一点顺风。</span></footer>
  </main>

  <script>
    (() => {
      'use strict';

      const byId = id => document.getElementById(id);
      const parts = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'chainring', 'chain', 'crank-near',
        'crank-far', 'near-leg-outline', 'near-leg', 'far-leg-outline',
        'far-leg', 'near-foot', 'far-foot', 'pelican', 'scarf-tail',
        'steering-wing', 'steering-feathers', 'eye', 'bike-shadow',
        'clouds-far', 'clouds-near', 'sea-ripples', 'boat', 'fence',
        'road-marks', 'road-grain', 'dune-plants', 'foreground-plants',
        'wind-lines', 'gull-one', 'gull-two'
      ].map(id => [id, byId(id)]));

      const play = byId('play-toggle');
      const label = byId('play-label');
      const icon = byId('play-icon');
      const status = byId('status');
      const speedButtons = Array.from(document.querySelectorAll('[data-speed]'));
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const TAU = Math.PI * 2;
      const crankCenter = { x: 607, y: 564 };
      const crankRadius = 35;
      const pedalRate = TAU / 1.8;
      const wheelRatio = 1.65;
      const tireRadius = 92;
      let time = 0;
      let speed = 1;
      let paused = motionPreference.matches;
      let lastFrame = null;
      let frameId = null;

      const n = value => Math.round(value * 100) / 100;
      const move = (element, x, y = 0) => {
        element.setAttribute('transform', 'translate(' + n(x) + ' ' + n(y) + ')');
      };
      const setRotation = (element, radians) => {
        element.setAttribute('transform', 'rotate(' + n(radians * 180 / Math.PI) + ')');
      };

      // Two rigid leg segments meet at a knee; their endpoint stays on the pedal.
      function legPath(hip, ankle, upperLength, lowerLength) {
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const along = (upperLength * upperLength - lowerLength * lowerLength + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upperLength * upperLength - along * along));
        const knee = {
          x: hip.x + along * dx / distance + bend * dy / distance,
          y: hip.y + along * dy / distance - bend * dx / distance
        };
        return 'M' + n(hip.x) + ' ' + n(hip.y) + 'L' + n(knee.x) + ' ' + n(knee.y) + 'L' + n(ankle.x) + ' ' + n(ankle.y);
      }

      function updateLeg(which, phase, bob) {
        const pedal = {
          x: crankCenter.x + crankRadius * Math.cos(phase),
          y: crankCenter.y + crankRadius * Math.sin(phase)
        };
        const hip = which === 'near'
          ? { x: 572, y: 409 + bob }
          : { x: 560, y: 410 + bob };
        const ankle = { x: pedal.x - 5, y: pedal.y - 10 };
        const path = legPath(hip, ankle, 99, 106);
        parts[which + '-leg'].setAttribute('d', path);
        parts[which + '-leg-outline'].setAttribute('d', path);
        move(parts[which + '-foot'], pedal.x, pedal.y);
        parts['crank-' + which].setAttribute('x2', n(pedal.x));
        parts['crank-' + which].setAttribute('y2', n(pedal.y));
      }

      function draw() {
        const phase = time * pedalRate;
        const wheelPhase = phase * wheelRatio;
        const bob = Math.sin(phase * 2) * 2.2;
        const travel = wheelPhase * tireRadius;

        setRotation(parts['rear-spokes'], wheelPhase);
        setRotation(parts['front-spokes'], wheelPhase);
        setRotation(parts.chainring, phase);
        parts.chain.setAttribute('stroke-dashoffset', n(-time * 42));
        move(parts.pelican, 0, bob);
        updateLeg('far', phase + Math.PI, bob);
        updateLeg('near', phase, bob);

        // The shoulder bobs while the feather tips remain on the handlebars.
        parts['steering-wing'].setAttribute('d',
          'M566 ' + n(340 + bob) +
          'Q592 ' + n(332 + bob) + ' 624 ' + n(359 + bob * .7) +
          'Q675 397 755 402L754 411Q679 420 613 ' + n(380 + bob * .6) +
          'Q571 ' + n(379 + bob) + ' 552 ' + n(359 + bob) + 'Z');
        parts['steering-feathers'].setAttribute('d',
          'M602 ' + n(364 + bob * .7) + 'Q665 406 739 405M612 ' +
          n(373 + bob * .5) + 'Q670 411 732 411');

        const flutter = Math.sin(time * 5) * 4;
        parts['scarf-tail'].setAttribute('d',
          'M633 276Q603 ' + n(260 + flutter) + ' 582 ' + n(276 + flutter) +
          'Q563 ' + n(288 - flutter) + ' 543 ' + n(269 + flutter) +
          'L554 ' + n(293 + flutter) + 'Q574 ' + n(306 - flutter) +
          ' 598 ' + n(292 + flutter * .4) + 'L633 291Z');

        const blinkPhase = time % 5.7;
        const eyeScale = blinkPhase > 5.4
          ? Math.max(.08, Math.abs(blinkPhase - 5.55) / .15)
          : 1;
        parts.eye.setAttribute('transform',
          'translate(681 227) scale(1 ' + n(eyeScale) + ') translate(-681 -227)');

        move(parts['clouds-far'], -(time * 5 % 1050));
        move(parts['clouds-near'], -(time * 9 % 1240));
        move(parts['sea-ripples'], -(time * 15 % 160));
        move(parts.boat, 1058 - (time * 4 % 140), 388 + Math.sin(time * 1.7) * 1.8);
        move(parts.fence, -(time * 35 % 160));
        move(parts['dune-plants'], -(time * 40 % 1200));
        move(parts['foreground-plants'], -(time * 170 % 1200));
        move(parts['road-marks'], -(travel % 320));
        move(parts['road-grain'], -(travel % 1200));
        move(parts['wind-lines'], Math.sin(time * 2.5) * 10, Math.sin(time * 3) * 2);
        parts['wind-lines'].setAttribute('opacity', n(.35 + Math.sin(time * 2.5) * .12));
        move(parts['gull-one'], Math.sin(time * .4) * 13, Math.sin(time * 1.1) * 3);
        move(parts['gull-two'], Math.sin(time * .3) * 9, Math.sin(time * .9) * 2);
        parts['bike-shadow'].setAttribute('rx', n(217 + bob * .5));
      }

      function frame(timestamp) {
        frameId = null;
        if (paused || document.hidden) return;
        if (lastFrame !== null) {
          time += Math.min((timestamp - lastFrame) / 1000, .05) * speed;
        }
        lastFrame = timestamp;
        draw();
        frameId = requestAnimationFrame(frame);
      }

      function schedule() {
        if (!paused && !document.hidden && frameId === null) {
          lastFrame = null;
          frameId = requestAnimationFrame(frame);
        }
      }

      function updateControls() {
        play.setAttribute('aria-pressed', String(paused));
        play.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        label.textContent = paused ? '继续' : '暂停';
        status.textContent = paused ? '停一会儿，看看海' : '正在海岸线骑行';
        icon.innerHTML = paused
          ? '<path d="M3 1.8L10 6L3 10.2Z" fill="currentColor"/>'
          : '<path d="M3 2V10M9 2V10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>';
      }

      play.addEventListener('click', () => {
        paused = !paused;
        if (paused && frameId !== null) {
          cancelAnimationFrame(frameId);
          frameId = null;
        }
        updateControls();
        schedule();
      });

      speedButtons.forEach(button => {
        button.addEventListener('click', () => {
          speed = Number(button.dataset.speed);
          speedButtons.forEach(item => {
            item.setAttribute('aria-pressed', String(item === button));
          });
        });
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && frameId !== null) {
          cancelAnimationFrame(frameId);
          frameId = null;
        }
        lastFrame = null;
        schedule();
      });

      motionPreference.addEventListener('change', event => {
        if (event.matches) {
          paused = true;
          if (frameId !== null) cancelAnimationFrame(frameId);
          frameId = null;
          updateControls();
        }
      });

      draw();
      updateControls();
      schedule();
    })();
  </script>
</body>
</html>
