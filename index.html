<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f7f8fa"><title>小人跑酷</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f8fa;color:#252a34;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.game{width:min(900px,94vw);text-align:center}.top{display:flex;justify-content:space-between;align-items:center;padding:0 8px;margin-bottom:12px}.title{font-size:clamp(21px,4vw,30px);font-weight:750}.score{font:700 18px ui-monospace,monospace;color:#525b68}.board{position:relative;border:1px solid #e1e5eb;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 16px 50px #25304412}canvas{display:block;width:100%;height:auto;touch-action:manipulation}.hint{margin:16px 8px;color:#7c8491;font-size:14px}.hint kbd{padding:3px 8px;border:1px solid #d6dbe3;border-radius:5px;background:#fff;color:#434b57;font:inherit}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#ffffffb8;backdrop-filter:blur(2px)}.panel{padding:24px 32px;border-radius:16px;background:#fff;box-shadow:0 8px 30px #202a3a1a}.panel h2{margin:0 0 8px;font-size:24px}.panel p{margin:0 0 16px;color:#737c89}.panel button{border:0;border-radius:8px;padding:11px 22px;background:#303947;color:white;font-size:15px;font-weight:650;cursor:pointer}.hidden{display:none}@media(max-width:560px){.hint{font-size:12px}.board{border-radius:9px}}
</style></head><body><main class="game"><div class="top"><div class="title">小人跑酷</div><div class="score">HI <span id="best">00000</span> &nbsp; <span id="score">00000</span></div></div><div class="board"><canvas id="game" width="900" height="270" aria-label="跑酷游戏区域"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="message">准备好了吗？</h2><p id="submessage">跳过障碍，跑得越远越好</p><button id="start">开始游戏</button></div></div></div><p class="hint">按 <kbd>空格</kbd> / <kbd>↑</kbd> 或点击画面跳跃　·　撞到障碍后按任意键重新开始</p></main><script>
(()=>{'use strict';const c=document.querySelector('#game'),x=c.getContext('2d'),overlay=document.querySelector('#overlay'),btn=document.querySelector('#start'),scoreOut=document.querySelector('#score'),bestOut=document.querySelector('#best'),msg=document.querySelector('#message'),sub=document.querySelector('#submessage');const W=900,G=220;let live=false,last=0,t=0,score=0,speed=360,spawn=1,obs=[],clouds=[{x:145,y:57,s:1},{x:510,y:91,s:.72},{x:790,y:48,s:.88}],best=Number(localStorage.getItem('runnerBest')||0);bestOut.textContent=String(best).padStart(5,'0');const p={x:86,y:G-68,w:40,h:68,vy:0,onGround:true,step:0};
function person(){const airborne=!p.onGround,bob=live&&p.onGround?Math.abs(Math.sin(p.step*2))*2.5:0,cycle=p.step,legSwing=live&&p.onGround?Math.sin(cycle)*13:0,armSwing=live&&p.onGround?Math.sin(cycle+Math.PI)*9:0,cx=p.x+20,headY=p.y+8+bob,shoulderY=p.y+23+bob,hipY=p.y+47+bob; x.lineCap='round';x.lineJoin='round';
// 身体微微前倾，头身比例和四肢更修长
x.strokeStyle='#303947';x.lineWidth=8;x.beginPath();x.moveTo(cx+2,shoulderY);x.lineTo(cx-2,hipY);x.stroke();
// 头部与颈部
x.fillStyle='#303947';x.beginPath();x.arc(cx+2,headY,7,0,Math.PI*2);x.fill();x.lineWidth=4;x.beginPath();x.moveTo(cx+2,headY+7);x.lineTo(cx+1,shoulderY);x.stroke();
// 摆臂：前后交替，肘部弯曲
x.lineWidth=4.5;x.beginPath();if(airborne){x.moveTo(cx,shoulderY+2);x.lineTo(cx+9,shoulderY-8);x.lineTo(cx+15,shoulderY-13);x.moveTo(cx+1,shoulderY+3);x.lineTo(cx-9,shoulderY-7);x.lineTo(cx-15,shoulderY-11)}else{x.moveTo(cx,shoulderY+2);x.lineTo(cx+armSwing*.55,shoulderY+13);x.lineTo(cx+armSwing,shoulderY+22);x.moveTo(cx+1,shoulderY+3);x.lineTo(cx-armSwing*.5,shoulderY+12);x.lineTo(cx-armSwing,shoulderY+19)}x.stroke();
// 双腿从髋部自然交替迈步；腾空时收膝
let stride=airborne?7:legSwing,knee=airborne?18:Math.max(0,Math.cos(cycle)*8);x.lineWidth=5.5;x.beginPath();x.moveTo(cx-2,hipY);x.lineTo(cx-5+stride*.45,hipY+12+knee*.35);x.lineTo(cx-5+stride,hipY+24);x.moveTo(cx-2,hipY);x.lineTo(cx+5-stride*.45,hipY+12+(airborne?10:8-knee*.25));x.lineTo(cx+5-stride,hipY+24);x.stroke();
// 鞋子给落脚方向一点变化
x.lineWidth=4.5;x.beginPath();x.moveTo(cx-5+stride,hipY+24);x.lineTo(cx+stride-1,hipY+25);x.moveTo(cx+5-stride,hipY+24);x.lineTo(cx+9-stride,hipY+25);x.stroke();
// 简洁的运动衣领与腰线
x.strokeStyle='#7586a0';x.lineWidth=2.5;x.beginPath();x.moveTo(cx-3,shoulderY+3);x.lineTo(cx+3,shoulderY+3);x.moveTo(cx-5,hipY-1);x.lineTo(cx+2,hipY);x.stroke()}
function draw(){x.clearRect(0,0,W,270);x.fillStyle='#fff';x.fillRect(0,0,W,270);clouds.forEach(q=>{x.fillStyle='#e9edf2';x.beginPath();x.arc(q.x,q.y,17*q.s,0,7);x.arc(q.x+20*q.s,q.y-8*q.s,23*q.s,0,7);x.arc(q.x+42*q.s,q.y+2*q.s,16*q.s,0,7);x.fill()});x.strokeStyle='#cfd5dd';x.lineWidth=2;x.beginPath();x.moveTo(0,G+1);x.lineTo(W,G+1);x.stroke();x.fillStyle='#d9dee5';for(let i=0;i<10;i++){let a=((i*113-t*speed*.65)%W+W)%W;x.fillRect(a,G+15+(i%3)*8,3,2)}obs.forEach(o=>{x.fillStyle='#4b9a70';x.fillRect(o.x+8,G-o.h,12,o.h);x.fillRect(o.x,G-o.h+13,9,5);x.fillRect(o.x,G-o.h+7,5,12)});person()}
function start(){live=true;score=0;speed=360;spawn=.8;t=0;obs=[];p.y=G-p.h;p.vy=0;p.onGround=true;p.step=0;btn.textContent='开始游戏';msg.textContent='准备好了吗？';sub.textContent='跳过障碍，跑得越远越好';overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}function jump(){if(p.onGround){p.vy=-690;p.onGround=false}}function end(){live=false;msg.textContent='游戏结束';sub.textContent='本次得分 '+String(Math.floor(score)).padStart(5,'0');btn.textContent='再玩一次';overlay.classList.remove('hidden');if(score>best){best=Math.floor(score);localStorage.setItem('runnerBest',best);bestOut.textContent=String(best).padStart(5,'0')}}
function loop(now){if(!live)return;let dt=Math.min((now-last)/1000,.035);last=now;t+=dt;score+=dt*10;speed=Math.min(720,360+t*8);if((spawn-=dt)<=0){let h=32+Math.random()*24;obs.push({x:W+20,h,w:30});spawn=(.95+Math.random()*.75)*Math.max(.62,360/speed)}p.vy+=1900*dt;p.y+=p.vy*dt;if(p.y>=G-p.h){p.y=G-p.h;p.vy=0;p.onGround=true}p.step+=dt*13;obs.forEach(o=>o.x-=speed*dt);obs=obs.filter(o=>o.x+o.w>0);clouds.forEach(q=>{q.x-=speed*.1*dt;if(q.x<-60)q.x=W+50});for(const o of obs)if(p.x+p.w-4>o.x+2&&p.x+4<o.x+o.w-2&&p.y+p.h-3>G-o.h){end();break}scoreOut.textContent=String(Math.floor(score)).padStart(5,'0');draw();if(live)requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{if(![' ','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();if(!live){start();return}if(e.key==='ArrowDown'){if(!p.onGround)p.vy=Math.max(p.vy,350)}else jump()});c.addEventListener('pointerdown',()=>live?jump():start());btn.addEventListener('click',start);draw()})();
</script></body></html>
