<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>飞刃 · 方块竞技场</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101722;color:#e8eef7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}.wrap{width:min(1000px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 2px 13px}.title{font-size:clamp(20px,4vw,28px);font-weight:800;letter-spacing:.03em}.stats{display:flex;gap:18px;color:#a9b7c9;font:600 13px ui-monospace,monospace}.stats b{color:#f4f7fb}.frame{border:1px solid #344153;border-radius:14px;overflow:hidden;background:#172231;box-shadow:0 18px 60px #0005}canvas{display:block;width:100%;height:auto;touch-action:none}.help{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:13px 4px;color:#9aa9bc;font-size:13px}.help kbd{display:inline-block;padding:2px 6px;border:1px solid #465569;border-radius:5px;background:#1b2736;color:#eff5fc;font:600 12px ui-monospace,monospace}.tip{color:#71839a}@media(max-width:600px){body{padding:12px}.stats{gap:9px;font-size:11px}.help{font-size:11px}}
</style></head>
<body><main class="wrap"><header><div class="title">飞刃 <span style="color:#58d6c3">/</span> 方块竞技场</div><div class="stats"><span>击败 <b id="kills">0</b></span><span>生命 <b id="hp">5</b></span><span>飞刃 <b id="bladeCount">0</b></span><span id="power">技能 无</span></div></header><div class="frame"><canvas id="arena" width="960" height="600" aria-label="方块竞技场游戏区域"></canvas></div><div class="help"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动　 <kbd>J</kbd> 投掷飞刃　 <kbd>K</kbd> 瞬移到飞刃</span><span class="tip">拾取发光方块获得技能　·　击败敌人恢复生命　·　按任意键重开</span></div></main>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#arena'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,killsEl=document.querySelector('#kills'),hpEl=document.querySelector('#hp'),bladeEl=document.querySelector('#bladeCount');
const powerEl=document.querySelector('#power'),keys=new Set(),player={x:W/2,y:H/2,size:25,speed:230,hp:5,invuln:0,face:{x:1,y:0},attack:0,shield:0};let blades=[],enemies=[],bullets=[],pickups=[],fires=[],particles=[],kills=0,spawnClock=0,last=0,gameOver=false,elapsed=0,pickupClock=5,power='';
const powerNames={double:'双发',shield:'防御盾',explosive:'爆炸刃',flame:'火焰刃'},rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function spawnPickup(){const types=['double','shield','explosive','flame'];let type=types[Math.floor(Math.random()*types.length)],x=rand(55,W-55),y=rand(55,H-55);for(let n=0;n<40&&(circleHitsWall(x,y,15)||Math.hypot(x-player.x,y-player.y)<100);n++){x=rand(45,W-45);y=rand(45,H-45)}if(!circleHitsWall(x,y,15))pickups.push({x,y,type,life:18,phase:rand(0,6.28)})}
function activatePickup(type){power=type;powerEl.textContent='技能 '+powerNames[type];if(type==='shield'){player.shield=8;player.powerTime=0}else player.powerTime=10;burst(player.x,player.y,type==='flame'?'#ff944d':type==='shield'?'#64b5ff':type==='explosive'?'#ffc55c':'#d591ff',14)}
const walls=[];function buildMaze(){walls.length=0;const t=18;for(const [x,y,w,h] of [[145,72,230,t],[520,72,280,t],[95,198,t,145],[245,186,240,t],[580,178,t,145],[690,230,180,t],[150,388,275,t],[485,338,250,t],[850,360,t,150],[300,468,t,110],[530,478,300,t],[420,250,t,85],[35,145,110,t],[800,145,125,t],[35,330,115,t],[425,510,105,t]])walls.push({x,y,w,h})}function circleHitsWall(x,y,r){return walls.some(w=>{const px=clamp(x,w.x,w.x+w.w),py=clamp(y,w.y,w.y+w.h);return (x-px)**2+(y-py)**2<r*r})}function clearRay(x1,y1,x2,y2){const n=Math.ceil(Math.hypot(x2-x1,y2-y1)/8);for(let i=1;i<n;i++){const t=i/n;if(walls.some(w=>{const x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;return x>=w.x-3&&x<=w.x+w.w+3&&y>=w.y-3&&y<=w.y+w.h+3}))return false}return true}function moveBody(o,dx,dy,r){const nx=clamp(o.x+dx,r+3,W-r-3),ny=clamp(o.y+dy,r+3,H-r-3);if(!circleHitsWall(nx,o.y,r))o.x=nx;if(!circleHitsWall(o.x,ny,r))o.y=ny}function enemySpawn(){for(let tries=0;tries<60;tries++){const x=rand(38,W-38),y=rand(38,H-38);if(!circleHitsWall(x,y,16)&&Math.hypot(x-player.x,y-player.y)>180&&clearRay(player.x,player.y,x,y)){let size=rand(20,30);enemies.push({x,y,size,speed:rand(48,78)+Math.min(35,kills*1.2),hp:1,phase:rand(0,6.28),shoot:rand(1.2,2.8)});return}}}
function reset(){buildMaze();player.x=W/2;player.y=H/2;player.hp=5;player.invuln=0;player.face={x:1,y:0};player.attack=0;player.shield=0;player.powerTime=0;blades=[];enemies=[];bullets=[];pickups=[];fires=[];particles=[];power='';powerEl.textContent='技能 无';kills=0;spawnClock=.8;pickupClock=1.5;elapsed=0;gameOver=false;killsEl.textContent='0';hpEl.textContent='5';last=performance.now();for(let i=0;i<3;i++)enemySpawn();requestAnimationFrame(loop)}
function throwBlade(){if(gameOver)return;const d=player.face,shots=power==='double'&&player.powerTime>0?[-.14,.14]:[0];for(const angle of shots){const cs=Math.cos(angle),sn=Math.sin(angle),vx=(d.x*cs-d.y*sn)*560,vy=(d.x*sn+d.y*cs)*560;blades.push({x:player.x+d.x*23,y:player.y+d.y*23,vx,vy,life:1.15,trail:[],fire:power==='flame'&&player.powerTime>0,explosive:power==='explosive'&&player.powerTime>0})}player.attack=.16;updateStats()}
function teleport(){if(gameOver||!blades.length)return;let b=blades.reduce((nearest,current)=>Math.hypot(current.x-player.x,current.y-player.y)<Math.hypot(nearest.x-player.x,nearest.y-player.y)?current:nearest),tx=clamp(b.x,WORLD_MARGIN,W-WORLD_MARGIN),ty=clamp(b.y,WORLD_MARGIN,H-WORLD_MARGIN);if(circleHitsWall(tx,ty,player.size/2)){const spots=[[tx+26,ty],[tx-26,ty],[tx,ty+26],[tx,ty-26]];let safe=spots.find(([x,y])=>x>20&&x<W-20&&y>20&&y<H-20&&!circleHitsWall(x,y,player.size/2));if(!safe)return;[tx,ty]=safe}particles.push({x:player.x,y:player.y,life:.3,color:'#8c7cff',size:player.size});player.x=tx;player.y=ty;player.face.x=Math.sign(b.vx)||player.face.x;player.face.y=Math.sign(b.vy)||player.face.y;blades.splice(blades.indexOf(b),1);player.invuln=.45;particles.push({x:player.x,y:player.y,life:.4,color:'#57e0ca',size:player.size*1.8});updateStats()}
const WORLD_MARGIN=18;function updateStats(){bladeEl.textContent=String(blades.length)}function countKill(){kills++;killsEl.textContent=String(kills);if(kills%3===0&&player.hp<5){player.hp++;hpEl.textContent=String(player.hp)}}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=rand(40,170);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.2,.55),max:.55,color,size:rand(2,5)})}}
function roundedRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawGrid(){ctx.fillStyle='#172231';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#263448';ctx.lineWidth=1;for(let x=24;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=24;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(const w of walls){ctx.shadowColor='#09111b';ctx.shadowBlur=9;ctx.fillStyle='#39495d';ctx.fillRect(w.x,w.y,w.w,w.h);ctx.shadowBlur=0;ctx.fillStyle='#63758b';if(w.w>w.h)ctx.fillRect(w.x,w.y,w.w,4);else ctx.fillRect(w.x,w.y,4,w.h)}ctx.strokeStyle='#405269';ctx.lineWidth=2;ctx.strokeRect(1,1,W-2,H-2)}
function draw(){drawGrid();for(const f of fires){ctx.globalAlpha=Math.min(1,f.life);ctx.shadowColor='#ff742f';ctx.shadowBlur=16;ctx.fillStyle='#ff8b3d';ctx.beginPath();ctx.arc(f.x,f.y,12+Math.sin(elapsed*18+f.x)*4,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}ctx.globalAlpha=1;for(const item of pickups){const color={double:'#c783ff',shield:'#64b8ff',explosive:'#ffc25b',flame:'#ff8150'}[item.type],s=15+Math.sin(item.phase)*2;ctx.save();ctx.translate(item.x,item.y);ctx.rotate(Math.PI/4);ctx.shadowColor=color;ctx.shadowBlur=18;ctx.fillStyle=color;ctx.fillRect(-s/2,-s/2,s,s);ctx.shadowBlur=0;ctx.fillStyle='#172231';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText({double:'×2',shield:'S',explosive:'✦',flame:'F'}[item.type],0,0);ctx.rotate(-Math.PI/4);ctx.fillStyle='#f0c878';ctx.font='11px system-ui';ctx.fillText(powerNames[item.type],0,s+12);ctx.restore()}for(const bullet of bullets){ctx.shadowColor='#ff616d';ctx.shadowBlur=12;ctx.fillStyle='#ff8790';ctx.beginPath();ctx.arc(bullet.x,bullet.y,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}for(const e of enemies){let pulse=Math.sin(e.phase)*2;ctx.shadowColor='#ff637a';ctx.shadowBlur=12;roundedRect(e.x-e.size/2-pulse/2,e.y-e.size/2-pulse/2,e.size+pulse,e.size+pulse,5,'#f15b72');ctx.shadowBlur=0;ctx.fillStyle='#371c2a';ctx.fillRect(e.x-6,e.y-3,4,4);ctx.fillRect(e.x+3,e.y-3,4,4);ctx.strokeStyle='#ffd4a3';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(e.x+e.size*.35,e.y+e.size*.2);ctx.lineTo(e.x+e.size*.7,e.y+e.size*.2);ctx.stroke();ctx.fillStyle='#ffe4b8';ctx.fillRect(e.x+e.size*.58,e.y+e.size*.08,9,5)}
for(const b of blades){b.trail.forEach((p,i)=>{ctx.globalAlpha=(i+1)/b.trail.length*.32;ctx.fillStyle='#7af2de';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx));ctx.shadowColor='#76f3e0';ctx.shadowBlur=12;ctx.fillStyle='#dffff9';ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(-7,-5);ctx.lineTo(-3,0);ctx.lineTo(-7,5);ctx.closePath();ctx.fill();ctx.restore()}
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/(p.max||.55));if(p.vx!==undefined){ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}else{ctx.strokeStyle=p.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1-p.life),0,Math.PI*2);ctx.stroke()}}ctx.globalAlpha=1;
if(player.shield>0){ctx.strokeStyle='#71bdff';ctx.lineWidth=3;ctx.shadowColor='#55aaff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(player.x,player.y,player.size*.9+Math.sin(elapsed*9)*2,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}if(player.invuln<=0||Math.floor(elapsed*18)%2===0){ctx.save();ctx.translate(player.x,player.y);ctx.shadowColor='#59dfce';ctx.shadowBlur=18;roundedRect(-player.size/2,-player.size/2,player.size,player.size,5,player.attack>0?'#b3fff2':'#52d7c4');ctx.shadowBlur=0;if(player.attack>0){ctx.strokeStyle=power==='flame'?'#ff9a4d':'#dffff9';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(player.face.x*12,player.face.y*12);ctx.lineTo(player.face.x*23,player.face.y*23);ctx.stroke()}ctx.fillStyle='#173942';ctx.fillRect(-7,-4,4,4);ctx.fillRect(3,-4,4,4);ctx.fillStyle='#eafffb';ctx.beginPath();ctx.moveTo(player.face.x*17,player.face.y*17);ctx.lineTo(player.face.x*9-player.face.y*4,player.face.y*9+player.face.x*4);ctx.lineTo(player.face.x*9+player.face.y*4,player.face.y*9-player.face.x*4);ctx.fill();ctx.restore();
// 手中始终有一枚备用飞刃，投掷后立即可见
ctx.save();ctx.translate(player.x+player.face.x*14,player.y+player.face.y*14);ctx.rotate(Math.atan2(player.face.y,player.face.x));ctx.fillStyle='#b9fff3';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-4,-3);ctx.lineTo(-1,0);ctx.lineTo(-4,3);ctx.closePath();ctx.fill();ctx.restore()}
if(gameOver){ctx.fillStyle='#07111dd9';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#f3f6fb';ctx.font='800 40px system-ui';ctx.fillText('被击中了！',W/2,H/2-18);ctx.fillStyle='#a9b8ca';ctx.font='18px system-ui';ctx.fillText('击败 '+kills+' 个敌人 · 按任意键重新开始',W/2,H/2+24)}}
function loop(now){if(gameOver){draw();return}let dt=Math.min((now-last)/1000,.04);last=now;elapsed+=dt;player.attack=Math.max(0,player.attack-dt);player.invuln=Math.max(0,player.invuln-dt);player.shield=Math.max(0,player.shield-dt);if(player.shield===0&&power==='shield'){power='';powerEl.textContent='技能 无'}if(player.powerTime>0){player.powerTime-=dt;if(player.powerTime<=0){power='';powerEl.textContent='技能 无'}}let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);if(dx||dy){let m=Math.hypot(dx,dy);dx/=m;dy/=m;moveBody(player,dx*player.speed*dt,dy*player.speed*dt,player.size/2);player.face={x:dx,y:dy}}player.x=clamp(player.x,player.size/2+3,W-player.size/2-3);player.y=clamp(player.y,player.size/2+3,H-player.size/2-3);
spawnClock-=dt;if(spawnClock<=0&&enemies.length<14){enemySpawn();spawnClock=Math.max(.45,1.25-kills*.018)}pickupClock-=dt;if(pickupClock<=0&&pickups.length<5){spawnPickup();pickupClock=rand(3,5)}for(let i=pickups.length-1;i>=0;i--){let item=pickups[i];item.phase+=dt*4;item.life-=dt;if(Math.hypot(player.x-item.x,player.y-item.y)<player.size/2+13){activatePickup(item.type);pickups.splice(i,1)}else if(item.life<=0)pickups.splice(i,1)}
for(let i=blades.length-1;i>=0;i--){let b=blades[i];b.trail.push({x:b.x,y:b.y});if(b.trail.length>7)b.trail.shift();const oldBX=b.x,oldBY=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(!clearRay(oldBX,oldBY,b.x,b.y)){b.life=0;if(b.fire)fires.push({x:oldBX,y:oldBY,life:2.4,damageClock:.2})}if(b.fire&&b.life>0&&Math.random()<dt*9)fires.push({x:b.x,y:b.y,life:2.4,damageClock:.2});for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(b.life>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.size/2+7){if(b.explosive){for(let k=enemies.length-1;k>=0;k--)if(Math.hypot(enemies[k].x-b.x,enemies[k].y-b.y)<92){burst(enemies[k].x,enemies[k].y,'#ffc55c',12);enemies.splice(k,1);countKill()}}else{burst(e.x,e.y,b.fire?'#ff9a4d':'#ff7184',10);enemies.splice(j,1);countKill()}if(b.fire)fires.push({x:b.x,y:b.y,life:3,damageClock:.25});if(b.explosive)burst(b.x,b.y,'#ffc55c',26);b.life=0;break}}if(b.life<=0||b.x<-30||b.x>W+30||b.y<-30||b.y>H+30)blades.splice(i,1)}
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.phase+=dt*5;e.shoot-=dt;if(d<440&&clearRay(e.x,e.y,player.x,player.y)&&e.shoot<=0){bullets.push({x:e.x,y:e.y,vx:dx/d*260,vy:dy/d*260,life:2.4});e.shoot=rand(1.7,3.2)}let oldX=e.x,oldY=e.y;moveBody(e,dx/d*e.speed*dt,dy/d*e.speed*dt,e.size/2);if(e.x===oldX&&e.y===oldY)e.phase+=Math.PI*.3;if(d<player.size/2+e.size/2&&player.invuln<=0){if(player.shield<=0){player.hp--;hpEl.textContent=String(player.hp)}else burst(player.x,player.y,'#68bfff',8);player.invuln=.8;burst(player.x,player.y,'#ff6279',12);e.x-=dx/d*35;e.y-=dy/d*35;if(player.hp<=0){gameOver=true;keys.clear()}}}for(let i=bullets.length-1;i>=0;i--){let b=bullets[i],nextX=b.x+b.vx*dt,nextY=b.y+b.vy*dt;b.life-=dt;if(circleHitsWall(nextX,nextY,5)){bullets.splice(i,1);continue}b.x=nextX;b.y=nextY;if(Math.hypot(b.x-player.x,b.y-player.y)<player.size/2+5){if(player.invuln<=0){if(player.shield>0){player.shield=0;power='';powerEl.textContent='技能 无'}else{player.hp--;hpEl.textContent=String(player.hp)}player.invuln=.8;burst(player.x,player.y,'#ff6778',10);if(player.hp<=0)gameOver=true}bullets.splice(i,1)}else if(b.life<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)bullets.splice(i,1)}for(let i=fires.length-1;i>=0;i--){let f=fires[i];f.life-=dt;f.damageClock-=dt;if(f.damageClock<=0){f.damageClock=.25;for(let j=enemies.length-1;j>=0;j--)if(Math.hypot(f.x-enemies[j].x,f.y-enemies[j].y)<28){burst(enemies[j].x,enemies[j].y,'#ff9a4d',6);enemies.splice(j,1);countKill()}}if(f.life<=0)fires.splice(i,1)}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;if(p.vx!==undefined){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97}if(p.life<=0)particles.splice(i,1)}updateStats();draw();if(!gameOver)requestAnimationFrame(loop)}
function handleKey(e){let key=e.key.toLowerCase();if(['w','a','s','d','j','k','arrowup','arrowdown','arrowleft','arrowright',' '].includes(key))e.preventDefault();if(gameOver){if(!['shift','control','alt'].includes(key)){keys.clear();reset()}return}if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(key))keys.add(key);if(e.repeat)return;if(key==='j')throwBlade();if(key==='k')teleport()}
window.addEventListener('keydown',handleKey);window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());buildMaze();draw();last=performance.now();requestAnimationFrame(loop);
})();
</script></body></html>
